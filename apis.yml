aid: energen
name: Energen
description: >-
  Energen Corporation was a U.S. oil and natural gas exploration and production
  company headquartered in Birmingham, Alabama, with operations focused on the
  Permian Basin in west Texas and southeast New Mexico. In November 2018,
  Energen was acquired by Diamondback Energy in an all-stock transaction, and
  the Energen brand was retired as its assets were integrated into Diamondback.
  No public developer APIs are currently published; this repository preserves
  the corporate record.
